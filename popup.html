<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Scribd PDF Downloader</title>
    <style>
        body { width: 280px; font-family: Arial, sans-serif; padding: 12px; margin: 0; background: #f9f9f9; }
        h3 { font-size: 15px; margin-top: 0; color: #333; text-align: center; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 8px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #cancelBtn { background: #dc3545; }
        #cancelBtn:hover { background: #a71d2a; }
        #status { font-size: 12px; color: #555; margin-bottom: 8px; text-align: center; min-height: 18px; }
        progress { width: 100%; height: 16px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h3>Scribd to PDF Pro</h3>
    <div id="status">Sẵn sàng</div>
    <progress id="progressBar" value="0" max="100"></progress>
    <button id="startBtn">Bắt đầu tải PDF</button>
    <button id="cancelBtn" disabled>Hủy bỏ</button>
    <script src="popup.js"></script>
</body>
</html>
